<style>
:root{
  --bg:#f4f7f6; --card:#ffffff; --ink:#14201d; --muted:#5d6b67; --line:#e2e8e6;
  --brand:#0f766e; --brand-ink:#ffffff; --soft:#e3f2ef; --warn:#b45309; --danger:#b91c1c;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1412;--card:#16201d;--ink:#e7efec;--muted:#93a39e;--line:#26332f;
    --brand:#2bb3a3;--brand-ink:#06201c;--soft:#173430;--warn:#f59e0b;--danger:#f87171;
    --shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
input,select,textarea,button{font:inherit;font-size:16px!important;color:inherit}
header.top{padding:18px 16px 6px}
header.top h1{margin:0;font-size:28px;letter-spacing:-.02em}
header.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
main{padding:8px 16px 24px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow);border:1px solid var(--line)}
.hero{background:var(--brand);color:var(--brand-ink);border:none}
.hero .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.hero .time{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:4px 0}
.hero .count{font-size:15px;opacity:.9}
.hero ul{margin:12px 0 0;padding-left:20px}
.hero li{margin:3px 0;font-size:17px}
.hero .notebox{background:rgba(255,255,255,.14);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
@media (prefers-color-scheme:dark){.hero .notebox{background:rgba(0,0,0,.15)}}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 6px;font-weight:600}
.meal{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:none}
.meal .t{font-weight:700;min-width:52px;font-variant-numeric:tabular-nums}
.meal .body{flex:1;min-width:0}

.meal.past .t,.meal.past .body{opacity:.45}
.meal.next .t{color:var(--brand)}
.meal.done .body{text-decoration:line-through;opacity:.5}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;cursor:pointer;padding:0}
.chk.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chk svg{width:16px;height:16px}
details.note{margin-top:6px}
details.note summary{cursor:pointer;color:var(--brand);font-size:14px}
details.note ul{font-size:14px;margin:6px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--soft);color:var(--brand);text-decoration:none}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.block{width:100%}
.btn.small{padding:8px 12px;font-size:14px!important;border-radius:10px}
.btn.danger{color:var(--danger);background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
label.f{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input[type=time],input[type=date],input[type=number],input[type=text],select,textarea{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:none}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
.muted{color:var(--muted)}.small{font-size:14px}
.empty{text-align:center;padding:28px 12px}
.empty .ico{font-size:44px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;cursor:pointer;display:block}
.drop:hover{border-color:var(--brand)}
.edmeal{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--bg)}
.edmeal .hd{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.edmeal .hd input[type=time]{width:120px;flex:none}
.edmeal .hd input[type=text]{flex:1}
.x{border:none;background:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px;line-height:1}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--brand);font-weight:600}
.hist{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:none}
ol.steps{padding-left:20px;margin:8px 0}
ol.steps li{margin:6px 0}
.warn{color:var(--warn)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{flex:1;border:none;background:none;padding:6px 0;color:var(--muted);font-size:12px!important;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;display:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sheet.on{display:block}
.sheet .bar{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);z-index:2}
.sheet .bar h3{margin:0;font-size:17px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="top">
  <h1 id="ttl">Hoje</h1>
  <p id="subttl"></p>
</header>

<main>
  <!-- HOJE -->
  <section class="view on" id="v-hoje"></section>

  <!-- PLANO -->

  <!-- AVISOS -->
  <section class="view" id="v-avisos"></section>
</main>

<nav class="tabs">
  <button data-tab="hoje" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoje</button>
  <button data-tab="plano">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Plano</button>
  <button data-tab="avisos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Avisos</button>
</nav>

<!-- Editor (rever plano) -->
<div class="sheet" id="sheet">
  <div class="bar">
    <button class="btn small" id="edCancel">Cancelar</button>
    <h3 id="edTitle">Rever plano</h3>
    <button class="btn small primary" id="edSave">Guardar</button>
  </div>
  <main id="edBody"></main>
</div>

<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Refeições — plano alimentar com avisos
   Tudo fica no dispositivo (localStorage). O PDF é lido
   localmente com pdf.js; nada é enviado para servidores.
   ========================================================= */
const APP_VER = 'v8';
const LS_KEY = 'refeicoes.v1';
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtDate = s => { if(!s) return ''; const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fromMin = m => `${pad(Math.floor(((m%1440)+1440)%1440/60))}:${pad(((m%60)+60)%60)}`;

/* ---------- estado ---------- */
function load(){
  try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.plans) return s; } catch(e){}
  return { plans: [], activeId: null, settings: { lead: 15, atTime: false }, done: {} };
}
let S = load();
// Garante campos novos (também depois de recuperar uma cópia de segurança).
function normalize(){
  S.settings = Object.assign({ lead: 15, atTime: false }, S.settings || {});
  S.settings.water = Object.assign({ on: false, every: 30, from: '08:00', to: '23:00', before: 0, after: 30 }, S.settings.water || {});
  if (!Array.isArray(S.settings.meds)) S.settings.meds = [{ id: 'protetor', name: 'Protetor de estômago', on: true, mode: 'first', offset: 30, time: '08:00' }];
  S.done = S.done || {}; S.plans = S.plans || [];
  // Vitaminas/minerais: passam a lembrete de medicação "com a 1.ª refeição" (com ✓); o aviso geral antigo das 09:00 é desligado.
  if (!S.migVit){
    if (!S.settings.meds.some(m => /vitamin|suplement|mineral/i.test(m.name)))
      S.settings.meds.push({ id: 'vitaminas', name: 'Vitaminas e minerais', on: true, mode: 'first', offset: 0, time: '08:30' });
    for (const p of S.plans) for (const g of p.general || []) if (/suplement|vitamin/i.test(g.text)){ g.remind = false; g.hidden = true; }
    S.migVit = true;
  }
}
normalize();
if (+S.settings.water.after < 20) S.settings.water.after = 30;
  if ('skip' in S.settings.water){ const k = +S.settings.water.skip || 0; S.settings.water.before = k; S.settings.water.after = Math.max(30, k); delete S.settings.water.skip; }
// Água NUNCA em cima das refeições: bloqueada desde o aviso da refeição (ou `before`, se maior) até `after` min depois (mín. 20).
// Nas janelas livres os lembretes ficam espaçados por igual, no máximo `every` min (encurta para caber). Igual ao servidor.
function waterSlots(plan){
  const w = S.settings.water; if (!w.on || !plan) return [];
  const lead = +S.settings.lead || 0;
  const from = toMin(w.from), to = toMin(w.to) + 1;
  const before = Math.max(10, lead, +w.before || 0), after = Math.max(20, +w.after || 30);
  const blocks = plan.meals.filter(m => m.enabled !== false).map(m => toMin(m.time)).map(m => [m - before, m + after]).sort((a, b) => a[0] - b[0]);
  const free = []; let cur = from;
  for (const [a, b] of blocks){ if (a > cur) free.push([cur, Math.min(a, to)]); cur = Math.max(cur, b); if (cur >= to) break; }
  if (cur < to) free.push([cur, to]);
  const rem = [...medReminders(plan), ...(plan.general || []).filter(g => g.remind && g.time)].map(r => toMin(r.time));
  const out = [];
  for (const [a, b] of free){
    const len = b - a; if (len < 5) continue;
    const n = Math.max(1, Math.ceil(len / Math.max(10, +w.every || 30)));
    for (let i = 0; i < n; i++){
      const t = a + Math.round(i * len / n / 5) * 5;
      if (t >= b || rem.some(r => Math.abs(t - r) < 10) || out.includes(t)) continue;
      out.push(t);
    }
  }
  return out;
}
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){ toast('Não foi possível guardar'); }
  if (S.plans.length) scheduleBackup();
}

/* ---------- medicação (ex.: protetor de estômago X min antes da 1.ª refeição) ---------- */
function medTime(m, plan){
  if (m.mode === 'fixed') return /^\d{2}:\d{2}$/.test(m.time || '') ? m.time : null;
  const first = plan && plan.meals.filter(x => x.enabled !== false).map(x => x.time).sort()[0];
  return first ? fromMin(toMin(first) - (+m.offset || 0)) : null;
}
function medReminders(plan){
  return S.settings.meds.filter(m => m.on && m.name && medTime(m, plan))
    .map(m => ({ time: medTime(m, plan), title: 'Tomar ' + m.name.charAt(0).toLowerCase() + m.name.slice(1),
                 body: m.mode === 'fixed' ? '' : +m.offset ? `${m.offset} min antes da 1.ª refeição` : 'Com a 1.ª refeição' }));
}

/* ---------- cópia de segurança no servidor (recuperar com código) ---------- */
const BACKUP_URL = 'https://ribeiro-engrave.com/api/refeicoes/backup/';
const fmtCode = c => (c || '').match(/.{1,4}/g)?.join('-') || '';
function newCode(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return [...crypto.getRandomValues(new Uint8Array(20))].map(x => A[x % 32]).join('');
}
let _bk = null;
function scheduleBackup(){ clearTimeout(_bk); _bk = setTimeout(doBackup, 2500); }
async function doBackup(){
  if (!S.plans.length) return;
  if (!S.backup || !S.backup.code) S.backup = { code: newCode() };
  const data = JSON.parse(JSON.stringify(S)); delete data.backup;
  try {
    const r = await fetch(BACKUP_URL + S.backup.code, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ data }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || 'erro ' + r.status);
    S.backup.at = new Date().toISOString(); S.backup.err = '';
  } catch(e){ S.backup.err = e.message === 'Failed to fetch' ? 'sem ligação' : e.message; }
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
  renderPlano();
}
async function restoreFrom(raw){
  const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 20) return toast('O código tem 20 letras e números', 3500);
  toast('A recuperar…', 8000);
  try {
    const r = await fetch(BACKUP_URL + code); const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || 'erro ' + r.status);
    const keepPush = S.push;
    S = j.data; normalize();
    S.push = Object.assign({ id: '', on: false }, S.push || {}, keepPush && keepPush.on ? keepPush : {});
    S.backup = { code, at: j.updated_at };
    save(); renderAll(); go('hoje'); syncPush();
    toast('Plano recuperado ✅', 3000);
  } catch(e){ toast('Não deu: ' + (e.message === 'Failed to fetch' ? 'sem ligação' : e.message), 4500); }
}
function askRestore(){
  const c = prompt('Código de recuperação (20 letras/números — está na app antiga em Plano → Cópia de segurança, ou no link que guardaste):');
  if (c) restoreFrom(c);
}
async function copyRestoreLink(){
  const link = location.origin + location.pathname + '#r=' + S.backup.code;
  const text = `Refeições — código de recuperação: ${fmtCode(S.backup.code)}\n${link}`;
  if (navigator.share){ try { await navigator.share({ title: 'Refeições — recuperação', text }); return; } catch(e){ if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast('Copiado — guarda nas Notas'); } catch(e){ prompt('Copia e guarda:', text); }
}
const activePlan = () => S.plans.find(p => p.id === S.activeId) || null;

function toast(msg, ms=2200){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}

/* =========================================================
   LEITURA DO PDF
   ========================================================= */
let pdfjsReady = null;
function loadPdfJs(){
  if (pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = PDFJS + 'pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; res(window.pdfjsLib); };
    s.onerror = () => { pdfjsReady = null; rej(new Error('Sem ligação para carregar o leitor de PDF')); };
    document.head.appendChild(s);
  });
  return pdfjsReady;
}

// Reconstrói linhas de texto agrupando fragmentos pela posição vertical.
async function pdfToLines(file){
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const rows = [];
    for (const it of tc.items){
      if (!('str' in it) || !it.str.trim() && !it.str.includes(' ')) continue;
      const x = it.transform[4], y = it.transform[5], h = Math.abs(it.transform[3]) || 10;
      let row = rows.find(r => Math.abs(r.y - y) < Math.max(2, h*0.4));
      if (!row){ row = { y, parts: [] }; rows.push(row); }
      row.parts.push({ x, s: it.str, w: it.width || 0 });
    }
    rows.sort((a, b) => b.y - a.y);
    for (const r of rows){
      r.parts.sort((a, b) => a.x - b.x);
      let s = '', end = null;
      for (const pt of r.parts){
        if (end !== null && pt.x - end > 1.5 && !/\s$/.test(s) && !/^\s/.test(pt.s)) s += ' ';
        s += pt.s; end = pt.x + pt.w;
      }
      s = s.replace(/\s+/g, ' ').trim();
      if (s) lines.push(s);
    }
  }
  return lines;
}

const TIME_RE = /(\d{1,2})\s*[.:hH]\s*(\d{2})\s*(?:horas|hrs?|h)?(?![\d])/i;
const BULLET_RE = /^\s*[-–—•·*▪●◦‣○]\s*/;
const AUTHOR_RE = /nutricionista|dietista|\bdra?\.\s|c[ée]dula|\(\d{3,5}N\)/i;
const REF_RE = /igual\s+(?:à|a|ao|aos)\s+(?:da\s+)?(?:refei[cç](?:ão|ao)\s+)?(?:das?|às?|as)\s+(\d{1,2})\s*[.:hH]\s*(\d{2})/i;

function cleanItem(s){
  return s.replace(BULLET_RE, '').replace(/\s+/g, ' ').replace(/\s+([.,;:)])/g, '$1').trim();
}

// Converte linhas de texto num plano: refeições (hora + itens), notas (ex.: "Composição do caldo") e avisos gerais.
function parsePlan(lines){
  const plan = { title: '', author: '', meals: [], notes: [], general: [] };
  const pre = [];
  let cur = null;      // {items:[]} — refeição ou nota a receber itens
  let last = null;     // [arr, idx] último item (para juntar linhas partidas)

  const addItem = (arr, text) => { if (!text) return; arr.push(text); last = [arr, arr.length - 1]; };

  for (const raw of lines){
    const line = raw.trim();
    if (!line) continue;
    if (AUTHOR_RE.test(line) && line.length < 90){ plan.author = line; continue; }

    const bullet = BULLET_RE.test(line);
    const m = !bullet && line.match(TIME_RE);
    if (m){
      const hh = +m[1], mm = +m[2];
      const before = line.slice(0, m.index).replace(/[\s:(\-–—|,]+$/, '').trim();
      const after = line.slice(m.index + m[0].length).replace(/^[\s:)\-–—|,]+/, '').trim();
      const looksRef = REF_RE.test(line) || /\b(igual|mesma|como|até|antes|depois|entre)\b|\b(das?|às?|as)\s*$/i.test(before);
      if (hh <= 23 && mm <= 59 && !looksRef && before.length <= 32 && (m.index === 0 || before.length > 0)){
        const meal = { id: uid(), time: `${pad(hh)}:${pad(mm)}`, name: before, items: [], enabled: true };
        plan.meals.push(meal);
        cur = meal; last = null;
        if (after) addItem(meal.items, cleanItem(after));
        continue;
      }
    }

    if (bullet){
      addItem(cur ? cur.items : plan.general, cleanItem(line));
      continue;
    }

    // Título de secção (ex.: "Composição do caldo:")
    if (/:\s*$/.test(line) && line.length <= 60 && plan.meals.length){
      const note = { id: uid(), title: line.replace(/:\s*$/, '').trim(), items: [] };
      plan.notes.push(note); cur = note; last = null;
      continue;
    }

    // Continuação de um item partido em duas linhas
    if (last && (/^[a-zà-ú(]/.test(line) || !/[.!?:)]$/.test(last[0][last[1]]))){
      last[0][last[1]] = cleanItem(last[0][last[1]] + ' ' + line);
      continue;
    }

    if (!plan.meals.length){ pre.push(line); continue; }

    // Texto solto depois das refeições → aviso geral (ex.: suplemento)
    cur = null;
    addItem(plan.general, cleanItem(line));
  }

  plan.title = pre.filter(l => !/^plano/i.test(l)).join(' ') || '';
  resolveRefs(plan);
  plan.meals.sort((a, b) => toMin(a.time) - toMin(b.time));
  plan.general = plan.general.map(text => {
    const vit = /suplement|vitamin/i.test(text);
    return { id: uid(), text, time: !vit && /medica/i.test(text) ? '09:00' : '', remind: !vit && /medica/i.test(text), hidden: vit };
  });
  return plan;
}

// "Igual à refeição das 12.30H" → copia os itens dessa refeição.
function resolveRefs(plan){
  for (const meal of plan.meals){
    const idx = meal.items.findIndex(i => REF_RE.test(i));
    if (idx < 0) continue;
    const r = meal.items[idx].match(REF_RE);
    const t = `${pad(+r[1])}:${pad(+r[2])}`;
    const src = plan.meals.find(x => x.time === t && x !== meal);
    if (src && !src.items.some(i => REF_RE.test(i))){
      meal.items.splice(idx, 1, ...src.items);
      meal.sameAs = t;
    }
  }
}

// Notas cujo assunto aparece nos itens da refeição (ex.: "caldo").
const STOP = new Set(['composição','composicao','preparação','preparacao','receita','como','fazer','para','sobre','notas','nota','observações','observacoes','lista','alimentos']);
function notesFor(plan, meal){
  const text = meal.items.join(' ').toLowerCase();
  return (plan.notes || []).filter(n => {
    const kws = n.title.toLowerCase().split(/[^a-zà-ú]+/).filter(w => w.length > 3 && !STOP.has(w));
    return kws.some(k => text.includes(k));
  });
}

/* =========================================================
   CALENDÁRIO (.ics)
   ========================================================= */
function icsEsc(s){ return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function fold(line){
  const enc = new TextEncoder(); const out = []; let cur = '', bytes = 0;
  for (const ch of line){
    const b = enc.encode(ch).length;
    if (bytes + b > (out.length ? 74 : 75)){ out.push(cur); cur = ''; bytes = 0; }
    cur += ch; bytes += b;
  }
  out.push(cur);
  return out.join('\r\n ');
}
function summaryOf(meal){
  let s = meal.items.join(' + ').replace(/\.(\s|$)/g, '$1').replace(/\s+/g, ' ').trim();
  if (s.length > 110) s = s.slice(0, 107).trim() + '…';
  return s || 'Refeição';
}
function buildICS(plan){
  const { lead, atTime } = S.settings;
  const now = new Date();
  const stamp = now.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const startDate = (plan.start || ymd(now)).replace(/-/g, '');
  const until = plan.end ? `;UNTIL=${plan.end.replace(/-/g, '')}T235959` : '';
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Refeicoes//PT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
             'X-WR-CALNAME:Plano alimentar'];
  const alarm = (desc, onTime) => {
    const a = ['BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(desc)}`, `TRIGGER:-PT${onTime ? 0 : Math.max(0, +lead || 0)}M`, 'END:VALARM'];
    if (!onTime && atTime && +lead > 0) a.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(desc)}`, 'TRIGGER:PT0M', 'END:VALARM');
    return a;
  };
  const ev = (key, time, summary, desc, onTime) => {
    const [h, m] = time.split(':');
    L.push('BEGIN:VEVENT', `UID:${plan.id}-${key}@refeicoes`, `DTSTAMP:${stamp}`,
      `DTSTART:${startDate}T${h}${m}00`, 'DURATION:PT15M', `RRULE:FREQ=DAILY${until}`,
      `SUMMARY:${icsEsc(summary)}`, `DESCRIPTION:${icsEsc(desc)}`, 'TRANSP:TRANSPARENT',
      ...alarm(summary, onTime), 'END:VEVENT');
  };
  for (const meal of plan.meals.filter(m => m.enabled !== false)){
    const notes = notesFor(plan, meal);
    let desc = meal.items.map(i => '• ' + i).join('\n');
    if (meal.sameAs) desc += `\n(igual à refeição das ${meal.sameAs})`;
    for (const n of notes) desc += `\n\n${n.title}:\n` + n.items.map(i => '• ' + i).join('\n');
    ev(meal.time.replace(':', ''), meal.time, `🍽️ ${meal.time} · ${summaryOf(meal)}`, desc);
  }
  for (const t of waterSlots(plan)){
    const hhmm = fromMin(t);
    ev('w' + hhmm.replace(':', ''), hhmm, '💧 Beber água', 'Uns goles pequenos, devagar.', true);
  }
  for (const m of medReminders(plan)) ev('med-' + m.time.replace(':', ''), m.time, '💊 ' + m.title, m.body || m.title, true);
  for (const g of (plan.general || []).filter(g => g.remind && g.time)){
    ev('g-' + g.id, g.time, `💊 ${g.text.replace(/\.$/, '')}`, g.text, true);
  }
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n') + '\r\n';
}

async function exportICS(mode){
  const plan = activePlan();
  if (!plan) return toast('Ainda não tens um plano ativo');
  const txt = buildICS(plan);
  const name = `plano-alimentar-${plan.start || ymd(new Date())}.ics`;
  const file = new File([txt], name, { type: 'text/calendar' });
  if (mode === 'share'){
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try { await navigator.share({ files: [file], title: 'Plano alimentar' }); } catch(e){}
      return;
    }
    toast('Partilha não suportada aqui — a descarregar o ficheiro');
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  S.lastExport = { planId: plan.id, at: new Date().toISOString(), lead: S.settings.lead }; save();
  renderAvisos();
}

const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

function nextMeal(plan, now = new Date()){
  const meals = plan.meals.filter(m => m.enabled !== false);
  if (!meals.length) return null;
  const nowMin = now.getHours()*60 + now.getMinutes();
  const today = meals.find(m => toMin(m.time) > nowMin);
  if (today) return { meal: today, inMin: toMin(today.time) - nowMin, tomorrow: false };
  return { meal: meals[0], inMin: 1440 - nowMin + toMin(meals[0].time), tomorrow: true };
}
function humanIn(min){
  if (min < 1) return 'agora';
  const h = Math.floor(min/60), m = min % 60;
  return 'daqui a ' + (h ? `${h} h` + (m ? ` ${m} min` : '') : `${m} min`);
}
function itemsHTML(items){ return '<ul>' + items.map(i => `<li>${esc(i)}</li>`).join('') + '</ul>'; }

function renderHoje(){
  const el = $('#v-hoje');
  const plan = activePlan();

    </div>`;
    return;
  }
  const now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();
  const today = ymd(now), done = new Set(S.done[today] || []);
  const nx = nextMeal(plan, now);
  const nextW = waterSlots(plan).find(t => t > nowMin);
  let hero = '';
  if (nx){
    const notes = notesFor(plan, nx.meal);
    const warnAt = fromMin(toMin(nx.meal.time) - (+S.settings.lead || 0));
    hero = `<div class="card hero">
      <div class="lbl">Próxima refeição${nx.tomorrow ? ' · amanhã' : ''}</div>
      <div class="time">${nx.meal.time}</div>

      ${notes.map(n => `<div class="notebox"><b>${esc(n.title)}:</b> ${n.items.map(esc).join(' · ')}</div>`).join('')}
    </div>`;
  }
  const lastW = waterSlots(plan).filter(t => t <= nowMin).pop();
  const lastWKey = lastW !== undefined ? 'w' + fromMin(lastW) : null;
  if (nextW !== undefined || lastWKey) hero += `<div class="card row" style="padding:12px 16px">
      <div>💧 ${nextW !== undefined ? `Próximo gole às <b>${fromMin(nextW)}</b> <span class="muted small">(${humanIn(nextW - nowMin)})</span>` : 'Sem mais lembretes de água hoje'}</div>
      ${lastWKey && nowMin - lastW < 120 ? (isAcked(lastWKey) ? `<span class="pill" style="flex:none">✓ bebi</span>` : `<button class="btn small primary" style="flex:none" onclick="ackNow('${lastWKey}')">✓ Bebi</button>`) : ''}
    </div>`;
  const meals = plan.meals.filter(m => m.enabled !== false);
  const list = meals.map(m => {
    const t = toMin(m.time), isDone = done.has(m.time);
    const cls = [isDone ? 'done' : '', !isDone && t <= nowMin ? 'past' : '', nx && !nx.tomorrow && nx.meal === m ? 'next' : ''].join(' ');
    const notes = notesFor(plan, m);
    return `<div class="meal ${cls}">
      <div class="t">${m.time}</div>
      <div class="body">${itemsHTML(m.items)}
        ${m.sameAs ? `<div class="sub">Igual à refeição das ${m.sameAs}</div>` : ''}
        ${notes.map(n => `<details class="note"><summary>${esc(n.title)}</summary>${itemsHTML(n.items)}</details>`).join('')}
      </div>
      <button class="chk ${isDone ? 'on' : ''}" aria-label="Feita" onclick="toggleDone('${m.time}')">${isDone ? ICON_CHECK : ''}</button>
    </div>`;
  }).join('');
  const gen = medReminders(plan).map(m => `<li>💊 ${esc(m.title)} às <b>${m.time}</b> ${isAcked('r' + m.time) ? '<span class="pill">✓ feito</span>' : toMin(m.time) <= nowMin ? `<button class="btn small" style="padding:2px 10px" onclick="ackNow('r${m.time}')">✓</button>` : ''}</li>`).join('') + (plan.general || []).filter(g => !g.hidden).map(g => `<li>${esc(g.text)}</li>`).join('');
  el.innerHTML = hero +
    `<h2>Hoje · ${done.size}/${meals.length} feitas</h2><div class="card" style="padding:4px 16px">${list}</div>` +
    (gen ? `<h2>Lembra-te</h2><div class="card"><ul style="margin:0;padding-left:18px">${gen}</ul></div>` : '') +
    (!avisosAtivos(plan) ? `<div class="card"><b>🔔 Avisos ainda não ativados</b><p class="small muted" style="margin:4px 0 10px">Ativa as notificações para receberes um aviso antes de cada refeição, com o que comer, mesmo com a app fechada.</p><button class="btn primary block" onclick="go('avisos')">Ativar avisos</button></div>` : '');
}
function toggleDone(time){
  const k = ymd(new Date()); const s = new Set(S.done[k] || []);
  const undo = s.has(time);
  undo ? s.delete(time) : s.add(time);
  S.done = { [k]: [...s] };   // guarda só o dia atual
  save(); renderHoje();
  sendAck('m' + time, undo);
}
// ✓ feito → o servidor deixa de repetir o aviso (key: m08:30 refeição, w09:00 água, r08:00 medicação/lembrete).
function sendAck(key, undo){
  if (!S.push || !S.push.on || !S.push.id) return;
  fetch(`https://ribeiro-engrave.com/api/refeicoes/device/${S.push.id}/ack`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key, undo: !!undo }) }).catch(() => {});
}
function ackLocal(key){
  if (!key) return;
  if (key[0] === 'm'){ const k = ymd(new Date()), s = new Set(S.done[k] || []); s.add(key.slice(1)); S.done = { [k]: [...s] }; }
  else { const k = ymd(new Date()); S.acks = S.acks && S.acks.date === k ? S.acks : { date: k, keys: [] }; if (!S.acks.keys.includes(key)) S.acks.keys.push(key); }
  save(); renderHoje(); go('hoje');
  toast('✓ Feito — não volta a avisar', 2500);
}
function ackNow(key){ sendAck(key); ackLocal(key); }
const isAcked = key => S.acks && S.acks.date === ymd(new Date()) && S.acks.keys.includes(key);

    const m = draft.meals[+box.dataset.i];

    m.name = $('[data-m=name]', box).value.trim();
    const items = $('[data-m=items]', box).value.split('\n').map(cleanItem).filter(Boolean);
    if (items.join('\n') !== m.items.join('\n')) delete m.sameAs;
    m.items = items;
  });
  $$('#edBody [data-n]').forEach(box => {
    const n = draft.notes[+box.dataset.n];
    n.title = $('[data-nk=title]', box).value.trim();
    n.items = $('[data-nk=items]', box).value.split('\n').map(cleanItem).filter(Boolean);
  });
  $$('#edBody [data-g]').forEach(box => {
    const g = draft.general[+box.dataset.g];
    g.text = $('[data-gk=text]', box).value.trim();
    g.remind = $('[data-gk=remind]', box).checked;
    g.time = $('[data-gk=time]', box).value;
  });
}
function addMeal(){ syncDraft(); const last = draft.meals[draft.meals.length-1]; draft.meals.push({ id: uid(), time: last ? fromMin(toMin(last.time) + 120) : '09:00', name: '', items: [], enabled: true }); renderEditor(); }
function rmMeal(i){ syncDraft(); draft.meals.splice(i, 1); renderEditor(); }
function addNote(){ syncDraft(); (draft.notes ||= []).push({ id: uid(), title: '', items: [] }); renderEditor(); }
function rmNote(i){ syncDraft(); draft.notes.splice(i, 1); renderEditor(); }
function addGen(){ syncDraft(); (draft.general ||= []).push({ id: uid(), text: '', time: '09:00', remind: true }); renderEditor(); }
function rmGen(i){ syncDraft(); draft.general.splice(i, 1); renderEditor(); }

$('#edCancel').onclick = () => { if (draftIsNew && !confirm('Descartar este plano?')) return; closeEditor(); };
$('#edSave').onclick = () => {
  syncDraft();
  const d = draft;
  d.meals = d.meals.filter(m => m.time && m.items.length).sort((a, b) => toMin(a.time) - toMin(b.time));
  d.notes = (d.notes || []).filter(n => n.title || n.items.length);
  d.general = (d.general || []).filter(g => g.text);
  if (!d.meals.length) return toast('Adiciona pelo menos uma refeição com hora e itens');
  if (!d.start) d.start = ymd(new Date());
  delete d.rawText;
  if (draftIsNew){
    const prev = activePlan();
    if (prev && !prev.end){
      const e = new Date(d.start + 'T12:00'); e.setDate(e.getDate() - 1); prev.end = ymd(e);
    }
    S.plans.push(d); S.activeId = d.id;
  } else {
    S.plans = S.plans.map(p => p.id === d.id ? d : p);
    if (S.lastExport && S.lastExport.planId === d.id) S.lastExport.stale = true;
  }
  save(); closeEditor(); renderAll(); syncPush();
  if (draftIsNew){ toast(S.push.on ? 'Plano ativado! As notificações já seguem o plano novo.' : 'Plano ativado! Agora ativa os avisos.', 3500); if (!S.push.on) go('avisos'); }
  else toast(!S.push.on && S.lastExport && S.lastExport.stale ? 'Guardado — atualiza os avisos no Calendário' : 'Guardado');
};

/* =========================================================
   NOTIFICAÇÕES PUSH (servidor do Ribeiro Engrave)
   O servidor guarda a subscrição deste iPhone + horas/itens do plano ativo e
   envia o aviso à hora certa. O id aleatório do dispositivo funciona como chave.
   ========================================================= */
const PUSH_API = 'https://ribeiro-engrave.com/api/refeicoes';
S.push = S.push || { id: '', on: false };
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function b64ToU8(b64){
  const s = atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}
function pushPlanPayload(plan){
  return {
    start: plan.start, end: plan.end || null,
    meals: plan.meals.filter(m => m.enabled !== false).map(m => {
      let body = m.items.length > 1 ? m.items.map(i => '• ' + i).join('\n') : '';
      for (const n of notesFor(plan, m)) body += (body ? '\n' : '') + `${n.title}: ` + n.items.map(i => i.replace(/\.$/, '')).join('; ');
      return { time: m.time, title: summaryOf(m), body };
    }),
    reminders: [...medReminders(plan), ...(plan.general || []).filter(g => g.remind && g.time).map(g => ({ time: g.time, title: g.text.replace(/\.$/, ''), body: '' }))],
    water: S.settings.water
  };
}
async function pushApi(path, opts = {}){
  const r = await fetch(PUSH_API + path, { ...opts, headers: { 'content-type': 'application/json' } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || ('erro ' + r.status));
  return j;
}
async function syncPush(sub, throwErr){
  if (!S.push.on || !S.push.id) return;
  const plan = activePlan(); if (!plan) return;
  try {
    if (!sub){ const reg = await navigator.serviceWorker.ready; sub = await reg.pushManager.getSubscription(); }
    if (!sub){ S.push.on = false; save(); renderAvisos(); renderHoje(); return; }
    await pushApi(`/device/${S.push.id}`, { method: 'PUT', body: JSON.stringify({
      subscription: sub.toJSON(), plan: pushPlanPayload(plan), lead: +S.settings.lead || 0,
      atTime: !!S.settings.atTime, tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Lisbon' }) });
    S.push.syncedAt = new Date().toISOString(); S.push.err = ''; save();
  } catch(e){
    S.push.err = e.message; save();
    if (throwErr) throw e;
  }
  if ($('#v-avisos').classList.contains('on')) renderAvisos();
}
async function enablePush(){
  if (!pushSupported()) return toast(isIOS ? 'Primeiro instala a app no ecrã principal e abre-a pelo ícone.' : 'Este browser não suporta notificações.', 4500);
  const btn = $('#pushBtn'); if (btn){ btn.disabled = true; btn.innerHTML = '<span class="spin"></span> A ativar…'; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('não autorizaste as notificações. Ativa em Definições → Notificações → Refeições');
    const cfg = await (await fetch(PUSH_API + '/config')).json();
    if (!cfg.enabled) throw new Error('o servidor ainda não tem as notificações configuradas');
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(cfg.publicKey) });
    if (!S.push.id) S.push.id = 'd' + uid() + uid() + uid();
    S.push.on = true; save();
    await syncPush(sub, true);
    await pushApi(`/device/${S.push.id}/test`, { method: 'POST' });
    toast('Notificações ativas! Vais receber uma de teste.', 3500);
  } catch(e){
    S.push.on = false; save();
    toast('Não deu: ' + e.message, 5000);
  }
  renderAvisos(); renderHoje();
}
async function testPush(){
  try { await syncPush(null, true); await pushApi(`/device/${S.push.id}/test`, { method: 'POST' }); toast('Enviada — deve chegar em segundos'); }
  catch(e){ toast('Erro: ' + e.message, 4000); }
}
async function disablePush(){
  if (!confirm('Desligar as notificações neste iPhone?')) return;
  try { await pushApi(`/device/${S.push.id}`, { method: 'DELETE' }); } catch(e){}
  try { const reg = await navigator.serviceWorker.ready; const s = await reg.pushManager.getSubscription(); if (s) await s.unsubscribe(); } catch(e){}
  S.push.on = false; save(); renderAvisos(); renderHoje();
}
function addMed(){ S.settings.meds.push({ id: uid(), name: '', on: true, mode: 'fixed', offset: 30, time: '09:00' }); save(); renderAvisos(); setTimeout(() => { const l = $$('#medsCard [data-mk=name]').pop(); l && l.focus(); }, 50); }
function rmMed(i){ if (!confirm(`Remover "${S.settings.meds[i].name || 'medicamento'}"?`)) return; S.settings.meds.splice(i, 1); save(); renderAvisos(); renderHoje(); syncPush(); }
const avisosAtivos = plan => S.push.on || (S.lastExport && S.lastExport.planId === plan?.id);

/* =========================================================
   VISTA: AVISOS
   ========================================================= */
function renderAvisos(){
  const el = $('#v-avisos');
  const plan = activePlan();
  const lead = +S.settings.lead || 0;
  const opts = [0, 5, 10, 15, 20, 30, 45, 60, 90];
  if (!opts.includes(lead)) opts.push(lead);
  const exported = S.lastExport && S.lastExport.planId === plan?.id;
  const stale = exported && (S.lastExport.stale || S.lastExport.lead !== lead);
  const hadOther = S.plans.length > 1;
  const ex = plan && plan.meals[0];
  const W = S.settings.water;
  let pushCard;
  if (S.push.on){
    pushCard = `<p style="margin-top:0"><b>✅ Notificações ativas neste iPhone</b></p>
      <p class="small muted">Recebes um aviso ${lead ? lead + ' min antes de cada refeição' : 'à hora de cada refeição'}${S.settings.atTime && lead ? ' e outro à hora' : ''}, com o que comer. Quando mudas o plano ou o tempo do aviso, a app atualiza tudo sozinha.</p>
      ${S.push.err ? `<p class="small warn">⚠️ Última atualização falhou (${esc(S.push.err)}). Toca em Enviar teste para tentar de novo.</p>` : S.push.syncedAt ? `<p class="small muted">Atualizado ${new Date(S.push.syncedAt).toLocaleString('pt-PT', { dateStyle: 'short', timeStyle: 'short' })}</p>` : ''}
      <div class="row"><button class="btn" onclick="testPush()">Enviar teste</button><button class="btn danger" onclick="disablePush()">Desligar</button></div>`;
  } else if (isIOS && !isStandalone()){
    pushCard = `<p style="margin-top:0"><b>🔔 Notificações da app</b></p>
      <p class="small">No iPhone, as notificações só funcionam com a app instalada:</p>
      <ol class="steps small"><li>No Safari, toca em <b>Partilhar</b> (quadrado com seta).</li><li><b>Adicionar ao ecrã principal</b>.</li><li>Abre a app <b>pelo ícone</b> e volta aqui a Avisos.</li></ol>
      <p class="small muted">Atenção: a app instalada começa vazia. Carrega lá o PDF.</p>`;
  } else {
    pushCard = `<p style="margin-top:0"><b>🔔 Notificações da app</b></p>
      <p class="small muted">Recebe um aviso ${lead ? lead + ' min antes de cada refeição' : 'à hora de cada refeição'}, com o que comer, mesmo com a app fechada.</p>
      ${ex ? `<p class="small" style="background:var(--soft);padding:10px 12px;border-radius:10px">Exemplo:<br><b>🍽️ Refeição daqui a ${lead} min (${ex.time})</b><br>${esc(summaryOf(ex))}</p>` : ''}
      <button class="btn primary block" id="pushBtn" onclick="enablePush()" ${plan ? '' : 'disabled'}>Ativar notificações</button>`;
  }
  el.innerHTML = `
    <div class="card stack">
      <div>
        <label class="f">Avisar quanto tempo antes de cada refeição?</label>
        <select id="lead">${opts.sort((a, b) => a - b).map(o => `<option value="${o}" ${o === lead ? 'selected' : ''}>${o === 0 ? 'À hora da refeição' : o < 60 ? o + ' minutos antes' : (o/60) + ' h antes'}</option>`).join('')}
          <option value="custom">Outro…</option></select>
      </div>
      <label class="small" style="display:flex;gap:10px;align-items:center">
        <input type="checkbox" id="atTime" ${S.settings.atTime ? 'checked' : ''} style="width:auto" ${lead === 0 ? 'disabled' : ''}>
        Avisar também à hora da refeição
      </label>
    </div>

    <div class="card stack">
      <label style="display:flex;gap:10px;align-items:center;font-weight:600">
        <input type="checkbox" id="wOn" ${W.on ? 'checked' : ''} style="width:auto"> 💧 Lembrar de beber água
      </label>
      ${W.on ? `
      <div><label class="f">De quanto em quanto tempo?</label>
        <select id="wEvery">${[15, 20, 30, 45, 60, 90, 120].map(o => `<option value="${o}" ${o === +W.every ? 'selected' : ''}>No máximo a cada ${o < 60 ? o + ' min' : (o/60).toString().replace('.', ',') + ' h'}</option>`).join('')}</select></div>
      <div class="row">
        <div><label class="f">Desde</label><input type="time" id="wFrom" value="${esc(W.from)}"></div>
        <div><label class="f">Até</label><input type="time" id="wTo" value="${esc(W.to)}"></div>
      </div>
      <div class="row">
        <div><label class="f">Sem água antes da refeição</label>
          <select id="wBefore">${[0, 15, 30, 45, 60].map(o => `<option value="${o}" ${o === +W.before ? 'selected' : ''}>${o ? o + ' min' : 'Desde o aviso'}</option>`).join('')}</select></div>
        <div><label class="f">Sem água depois da refeição</label>
          <select id="wAfter">${[20, 30, 45, 60, 90].map(o => `<option value="${o}" ${o === +W.after ? 'selected' : ''}>${o} min</option>`).join('')}</select></div>
      </div>
      <p class="small muted" style="margin:0">${waterSlots(plan).length} lembretes por dia${waterSlots(plan).length ? ': ' + waterSlots(plan).slice(0, 6).map(fromMin).join(', ') + (waterSlots(plan).length > 6 ? '…' : '') : ''}. Nunca lembra entre o aviso da refeição e ${Math.max(20, +W.after || 30)} min depois; nos intervalos livres encurta o tempo entre lembretes para caberem.</p>` : ''}
    </div>
    <div class="card stack" id="medsCard">
      <b>💊 Medicação</b>
      ${S.settings.meds.map((m, i) => `
        <div class="edmeal" data-med="${i}" style="margin:0">
          <div class="hd">
            <input type="checkbox" data-mk="on" ${m.on ? 'checked' : ''} style="width:auto;flex:none" aria-label="Ativo">
            <input type="text" data-mk="name" value="${esc(m.name)}" placeholder="Nome do medicamento">
            <button class="x" onclick="rmMed(${i})" aria-label="Remover">×</button>
          </div>
          <div class="row">
            <select data-mk="mode"><option value="first" ${m.mode !== 'fixed' ? 'selected' : ''}>Antes da 1.ª refeição</option><option value="fixed" ${m.mode === 'fixed' ? 'selected' : ''}>A uma hora fixa</option></select>
            ${m.mode === 'fixed'
              ? `<input type="time" data-mk="time" value="${esc(m.time || '')}">`
              : `<select data-mk="offset">${[0, 10, 15, 20, 30, 45, 60].map(o => `<option value="${o}" ${o === +m.offset ? 'selected' : ''}>${o ? o + ' min antes' : 'Com a refeição'}</option>`).join('')}</select>`}
          </div>
          <div class="small muted" style="margin-top:6px">${m.on ? (medTime(m, plan) ? `Aviso todos os dias às <b>${medTime(m, plan)}</b>` : 'Carrega um plano para calcular a hora') : 'Desligado'}</div>
        </div>`).join('')}
      <button class="btn block" onclick="addMed()">+ Adicionar medicamento</button>
    </div>
    ${!plan ? `<div class="card empty"><p class="muted">Carrega primeiro um plano no separador Plano.</p></div>` : `
    <div class="card">${pushCard}</div>

    <details class="card" ${exported ? 'open' : ''}>
      <summary><b>Alternativa: avisos no Calendário do iPhone</b></summary>
      ${exported && !stale ? `<p>✅ Adicionados ao Calendário em ${new Date(S.lastExport.at).toLocaleDateString('pt-PT')}.</p>` : ''}
      ${stale ? `<p class="warn"><b>⚠️ Mudaste o plano ou o tempo do aviso.</b> Volta a adicionar ao Calendário (e apaga os antigos, ver passo 4).</p>` : ''}
      <p class="small muted">Funciona sem internet e sem servidor. Cria um evento diário por refeição no Calendário, com alarme ${lead ? lead + ' min antes' : 'à hora'}.${S.push.on ? ' <b>Se já tens as notificações da app ativas, não precisas disto, senão recebes os avisos a dobrar.</b>' : ''}</p>
      <button class="btn block" onclick="exportICS('download')">📅 Adicionar ao Calendário</button>
      <div style="height:8px"></div>
      <button class="btn block" onclick="exportICS('share')">Partilhar ficheiro…</button>
      <ol class="steps small">
        <li>Toca em <b>Adicionar ao Calendário</b>. No iPhone aparece a lista de eventos. Toca em <b>Adicionar todos</b>.</li>
        <li>Se aparecer um ficheiro descarregado em vez da lista, abre-o (Ficheiros → Descargas) e toca em <b>Adicionar todos</b>.</li>
        <li>Dica: no Calendário cria antes um calendário chamado <b>Plano alimentar</b> e escolhe-o ao importar.</li>
        <li><b>Quando mudares de plano${hadOther ? ' (é o teu caso)' : ''}:</b> apaga os eventos antigos (Calendário → Calendários → ⓘ em "Plano alimentar" → Apagar calendário). Depois volta a adicionar.</li>
      </ol>
    </details>`}`;
  $('#lead').onchange = e => {
    let v = e.target.value;
    if (v === 'custom'){ v = prompt('Quantos minutos antes?', String(lead)); if (v === null || isNaN(+v) || +v < 0) return renderAvisos(); }
    S.settings.lead = Math.round(+v); save(); renderAvisos(); renderHoje(); syncPush();
  };
  const wSet = (k, v) => { S.settings.water[k] = v; if (S.lastExport) S.lastExport.stale = true; save(); renderAvisos(); renderHoje(); syncPush(); };
  $('#wOn').onchange = e => wSet('on', e.target.checked);
  if ($('#wEvery')){
    $('#wEvery').onchange = e => wSet('every', +e.target.value);
    $('#wBefore').onchange = e => wSet('before', +e.target.value);
    $('#wAfter').onchange = e => wSet('after', +e.target.value);
    $('#wFrom').onchange = e => e.target.value && wSet('from', e.target.value);
    $('#wTo').onchange = e => e.target.value && wSet('to', e.target.value);
  }
  $$('#medsCard [data-mk]').forEach(inp => inp.onchange = () => {
    const i = +inp.closest('[data-med]').dataset.med, k = inp.dataset.mk, m = S.settings.meds[i];
    m[k] = inp.type === 'checkbox' ? inp.checked : (k === 'offset' ? +inp.value : inp.value.trim());
    if (k === 'mode' && m.mode === 'fixed' && !m.time) m.time = medTime({ ...m, mode: 'first', offset: m.offset || 30 }, activePlan()) || '08:00';
    if (S.lastExport) S.lastExport.stale = true;
    save(); renderAvisos(); renderHoje(); syncPush();
  });
  $('#atTime').onchange = e => { S.settings.atTime = e.target.checked; if (S.lastExport) S.lastExport.stale = true; save(); renderAvisos(); syncPush(); };
}

/* =========================================================
   NAVEGAÇÃO
   ========================================================= */
const TITLES = { hoje: 'Hoje', plano: 'Plano', avisos: 'Avisos' };
function go(tab){
  $$('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + tab));
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#ttl').textContent = TITLES[tab];
  setSub(tab);
  if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);
  window.scrollTo(0, 0);
}
function setSub(tab){
  const p = activePlan();
  const d = new Date().toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#subttl').textContent = tab === 'hoje' ? d.charAt(0).toUpperCase() + d.slice(1) : (p ? p.name : '');
}
$$('nav.tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));
function renderAll(){ renderHoje(); renderPlano(); renderAvisos(); setSub((location.hash || '#hoje').slice(1)); }

renderAll();
go(TITLES[(location.hash || '').slice(1)] ? location.hash.slice(1) : 'hoje');
setInterval(() => { if (!$('#sheet').classList.contains('on')) renderHoje(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderHoje(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(() => syncPush()).catch(() => {});
// Pede ao iOS para não apagar os dados da app por falta de espaço.
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
// Vindo de uma notificação tocada: …/#ok=m08:30 (o service worker já avisou o servidor).
function handleOkHash(){
  const m = location.hash.match(/[#&]ok=([^&]+)/);
  if (m){ history.replaceState(null, '', location.pathname + '#hoje'); ackLocal(decodeURIComponent(m[1])); }
}
handleOkHash();
window.addEventListener('hashchange', handleOkHash);
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'ack') ackLocal(e.data.key); });
// Link de recuperação: …/refeicoes/#r=CODIGO
(() => {
  const m = location.hash.match(/[#&]r=([A-Za-z0-9-]+)/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + '#hoje');
  if (S.plans.length && !confirm('Substituir o plano deste iPhone pelo da cópia de segurança?')) return;
  restoreFrom(m[1]);
})();
if (S.plans.length && (!S.backup || !S.backup.at)) scheduleBackup();
</script>
